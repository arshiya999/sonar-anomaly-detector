services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: aqua
      POSTGRES_DB: aqua_vision
    ports:
      - "5432:5432"
    volumes:
      - aqua_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqua -d aqua_vision"]
      interval: 5s
      retries: 10

  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    ports:
      - "8765:8765"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://aqua:aqua@db:5432/aqua_vision
      MODEL_PATH: /app/ml/weights/sonar-debris-yolo11n.pt
      STORAGE_DIR: /app/data/aqua_storage
      CORS_ORIGINS: http://127.0.0.1:47281,http://localhost:47281
    ports:
      - "8766:8766"
    volumes:
      - aqua_store:/app/data/aqua_storage
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "47281:47281"
    environment:
      ML_API_URL: http://ml:8765
      OPS_API_URL: http://api:8766
      PORT: "47281"
    depends_on:
      - ml
      - api

volumes:
  aqua_pg:
  aqua_store:
