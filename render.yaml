# Render: detector + ops API (not the Next.js UI — that stays on Vercel).
# Dashboard: New → Blueprint → this GitHub repo, branch main.
# Public URLs (this Render workspace):
#   https://aquavision-ml-h8vr.onrender.com
#   https://aquavision-backend-5g8u.onrender.com

services:
  - type: web
    name: aquavision-ml
    runtime: python
    plan: free
    buildCommand: pip install -r ml/requirements.txt
    startCommand: python -m uvicorn --app-dir ml server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: aquavision-backend-7iuh
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r ml/requirements.txt
    startCommand: PYTHONPATH=backend python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: CORS_ORIGINS
        value: "*"
      - key: MODEL_PATH
        value: ml/weights/sonar-debris-yolo11n.pt
