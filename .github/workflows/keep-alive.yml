# Keep Render services awake so judges can open Aqua Vision anytime.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping detector
        run: curl -sfS --retry 3 --retry-delay 5 --max-time 60 https://aquavision-ml.onrender.com/health
      - name: Ping ops API
        run: curl -sfS --retry 3 --retry-delay 5 --max-time 30 https://aquavision-backend-7iuh.onrender.com/api/system/status
